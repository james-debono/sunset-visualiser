<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Sun half-set behind a curved horizon. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243763"/>
      <stop offset="0.5" stop-color="#8a4f72"/>
      <stop offset="0.75" stop-color="#f39447"/>
    </linearGradient>
    <radialGradient id="glow" cx="32" cy="44" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <circle cx="32" cy="44" r="30" fill="url(#glow)"/>
    <circle cx="32" cy="44" r="19" fill="#ffc94d"/>
    <path d="M0 47 Q32 37 64 47 V64 H0 Z" fill="#1f4470"/>
    <path d="M0 47 Q32 37 64 47" fill="none" stroke="#ffb35c" stroke-width="2.2"/>
  </g>
</svg>
